
services:
  drupal:
    image: drupal:11-apache
    ports: ["127.0.0.1:8086:80"]
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set password}
      POSTGRES_HOST: db
    volumes:
      - drupal_sites:/var/www/html/sites
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set password}
    volumes:
      - drupal_db:/var/lib/postgresql/data

volumes:
  drupal_sites:
  drupal_db:
